# https://pre-commit.com
default_install_hook_types: [commit-msg, pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: true
repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-use-type-annotations
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
      - id: text-unicode-replacement-char
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
        args: [--unsafe]
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        types: [python]
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^tests/e2e/(_auth_app|_upload_app|_mfa_app|_object_perm_app|_realtime_app)\.py$
      - id: trailing-whitespace
        types: [python]
  - repo: local
    hooks:
      - id: commitizen
        name: commitizen
        entry: uv run cz check
        args: [--commit-msg-file]
        require_serial: true
        language: system
        stages: [commit-msg]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        args: ["--force-exclude", "--extend-fixable=F401,F841", "--fix"]
        require_serial: true
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        args: [--force-exclude]
        require_serial: true
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy
        args: [src]
        language: system
        types: [python]
        pass_filenames: false
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        args: [src]
        language: system
        types: [python]
        pass_filenames: false
      - id: test-unit
        name: unit tests
        entry: uv run pytest -vv -q tests/unit
        language: system
        pass_filenames: false
        stages: [pre-push]
        types_or: [python, html, css, javascript]
      - id: test-e2e
        name: e2e tests
        entry: uv run pytest tests/e2e --ignore=tests/e2e/test_profit_loss_report.py
        language: system
        pass_filenames: false
        stages: [pre-push]
        types_or: [python, html, css, javascript]
      - id: security-check
        name: security check
        entry: uv run poe security-check
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: (pyproject\.toml|uv\.lock)$
